stages:
  - verify
  - deploy

verify:layout:
  stage: verify
  image: alpine:3.20
  script:
    - apk add --no-cache bash findutils grep
    - bash ops/verify-layout.sh

fenrir-bridge:install-and-build:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/fenrir-bridge/package.json
  script:
    - cd apps/fenrir-bridge
    - npm ci
    - npm run build

fenrir-cinema:install-and-build:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/fenrir-cinema/package.json
  script:
    - cd apps/fenrir-cinema
    - npm install
    - npm run build

# Live login diagnostic. Runs on GitLab's network (which CAN reach WorkOS and the
# production site), needs NO Cloudflare token. It reads exactly what the live site
# sends to WorkOS and classifies the failure so the real cause is unambiguous.
fenrir-bridge:diagnose-login:
  stage: verify
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^claude\//'
  script:
    - apk add --no-cache bash curl grep sed coreutils
    - bash apps/fenrir-bridge/scripts/diagnose-login.sh
    - echo "=================================================="
    - bash apps/fenrir-bridge/scripts/probe-login-app.sh
    - echo "=================================================="
    - bash apps/fenrir-bridge/scripts/probe-redirects.sh

# Deploy the corrected login app to the Vercel `myfenrir-login` project
# (login.myfenrir.com). Runs on a GitLab runner (which can reach Vercel), so it
# needs only a VERCEL_TOKEN CI variable — no local Vercel access required.
# Fixes the "Invalid client ID" by replacing the app that ships client_replace_me.
deploy-login-app:
  stage: deploy
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^claude\// && $VERCEL_TOKEN'
      when: manual
  script:
    - npm i -g vercel@latest
    - cd myfenrir-login-fix
    # Link to the existing myfenrir-login project (login.myfenrir.com is aliased to it).
    - vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope pupfrs-projects || true
    - 'printf ''{"projectId":"prj_aHokkMeJysf4z2KV6HoqYweQYXeK","orgId":"team_bBVvJfbJ6tQWNqcHrjopBrjd"}'' > .vercel/project.json 2>/dev/null || (mkdir -p .vercel && printf ''{"projectId":"prj_aHokkMeJysf4z2KV6HoqYweQYXeK","orgId":"team_bBVvJfbJ6tQWNqcHrjopBrjd"}'' > .vercel/project.json)'
    # If WORKOS_API_KEY is exposed to this job, ensure it is set on the project.
    - |
      if [ -n "${WORKOS_API_KEY:-}" ]; then
        vercel env rm WORKOS_API_KEY production --yes --token "$VERCEL_TOKEN" --scope pupfrs-projects >/dev/null 2>&1 || true
        printf '%s' "$WORKOS_API_KEY" | vercel env add WORKOS_API_KEY production --token "$VERCEL_TOKEN" --scope pupfrs-projects || true
      fi
    - vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope pupfrs-projects
    # Verify the live app now sends the valid client id.
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null 2>&1 || true
    - sleep 5
    - |
      r="$(curl -s -X POST https://login.myfenrir.com/api/auth/login?provider=google -D - -o /dev/null || true)"
      echo "login route headers:"; printf '%s\n' "$r" | grep -iE 'location|http/' | head
      curl -s -o /dev/null -w 'login page status: %{http_code}\n' https://login.myfenrir.com/ || true

# Production deploy for fenrir-bridge to Cloudflare Pages.
#
# Auth in CI is API-token based (CLOUDFLARE_API_TOKEN), NOT the operator's
# browser OAuth. The repo's `npm run deploy:ci` runs a guard that does
# `wrangler whoami` with the token stripped, which only works with OAuth and
# would fail here, so this job calls wrangler directly with the token.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables, all "Masked",
# "Protected" so they only expose on the protected main branch):
#   CLOUDFLARE_API_TOKEN   - Cloudflare token scoped to Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
#   SESSION_SECRET         - Pages session signing secret
#   WORKOS_CLIENT_ID       - WorkOS AuthKit client id
#   WORKOS_API_KEY         - WorkOS API key (sk_...)
#
# Gated to main and manual: click "Run" on the pipeline to ship. To make merges
# auto-deploy, change `when: manual` to `when: on_success`.
# Feature branches matching claude/* also get a manual deploy button so fixes
# can be shipped directly without merging to main first.
fenrir-bridge:deploy:
  stage: deploy
  image: node:22
  needs:
    - fenrir-bridge:install-and-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^claude\// && $CLOUDFLARE_API_TOKEN'
      when: manual
  variables:
    WRANGLER: "deno run -A npm:wrangler@4.90.0"
    WRANGLER_SEND_METRICS: "false"
  script:
    - curl -fsSL https://deno.land/install.sh | sh
    - export PATH="$HOME/.deno/bin:$PATH"
    - cd apps/fenrir-bridge
    - npm ci
    - npm run build
    # Push production secrets only when provided, so an unset var never clobbers
    # an existing value with an empty string.
    - |
      for k in SESSION_SECRET WORKOS_CLIENT_ID WORKOS_API_KEY; do
        v="$(eval printf '%s' "\${$k:-}")"
        if [ -n "$v" ]; then
          printf '%s' "$v" | $WRANGLER pages secret put "$k" --project-name fenrir-bridge
          echo "set $k"
        else
          echo "skip $k (not set in CI variables)"
        fi
      done
    - $WRANGLER pages deploy dist --project-name fenrir-bridge --branch main
    # Verify production responds as expected.
    - |
      hz="$(curl -s -o /dev/null -w '%{http_code}' https://www.myfenrir.com/healthz || echo ERR)"
      wo="$(curl -s -o /dev/null -w '%{http_code}' 'https://auth.myfenrir.com/api/auth/workos/login?provider=google' || echo ERR)"
      echo "healthz=$hz (expect 200)  workos=$wo (expect 302)"
      test "$hz" = "200"
      test "$wo" = "302"
