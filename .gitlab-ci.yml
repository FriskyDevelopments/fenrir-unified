stages:
  - review
  - verify
  - deploy

# Required CI/CD variables (Settings → CI/CD → Variables, Masked):
#   DASHSCOPE_API_KEY  — Alibaba DashScope key
#   GITLAB_TOKEN       — Project Access Token, scope: api

qwen_review:
  stage: review
  image: debian:bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $DASHSCOPE_API_KEY && $GITLAB_TOKEN'
    - when: never
  timeout: 10 minutes
  allow_failure: true
  before_script:
    - apt-get update -q && apt-get install -y -q git jq curl ca-certificates
  script: |
    TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    git fetch origin "$TARGET" --depth=50 2>/dev/null || true
    DIFF="$(git diff "origin/${TARGET}"...HEAD 2>/dev/null || git diff HEAD~1 || echo 'no diff')"
    DIFF="${DIFF:0:14000}"
    PAYLOAD="$(jq -n --arg diff "$DIFF" '{model:"qwen-coder-plus-latest",messages:[{role:"system",content:"You are a strict senior engineer."},{role:"user",content:("Review this MR diff. Check: security, secrets, breaking changes.\n\n- **Verdict:** APPROVE / REQUEST CHANGES / COMMENT\n- **Risks**\n- **Required fixes**\n- **Nits** (<=3)\n\nDiff:\n```\n"+$diff+"\n```")}],max_tokens:1000,temperature:0.1}')"
    REVIEW="$(curl -sf https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions -H "Authorization: Bearer ${DASHSCOPE_API_KEY}" -H "Content-Type: application/json" -d "$PAYLOAD" | jq -r '.choices[0].message.content // "Review unavailable."')"
    curl -sf -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H "Content-Type: application/json" \
      -d "$(jq -n --arg r "### 🤖 Qwen Code Review\n\n${REVIEW}\n\n---\n<sub>qwen-coder-plus-latest</sub>" '{body:$r}')" \
      "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"

verify:layout:
  stage: verify
  image: alpine:3.20
  script:
    - apk add --no-cache bash findutils grep
    - bash ops/verify-layout.sh

fenrir-bridge:install-and-build:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/fenrir-bridge/package.json
  script:
    - cd apps/fenrir-bridge
    - npm ci
    - npm run typecheck
    - npm run build
    - npm audit --audit-level=high

# Hermetic auth tests: Supabase, Neon, and every OAuth provider fetch are mocked,
# so this runs with no network egress and no secrets.
fenrir-bridge:test:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/fenrir-bridge/package.json
  script:
    - cd apps/fenrir-bridge
    - npm ci
    - npm test

# Community is a separate package and must be reproducible on its own. Keep
# install deterministic: a stale lockfile must fail here, never silently fall
# back to `npm install` during deployment.
community-bridge:verify:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/community-bridge/package.json
  script:
    - cd apps/community-bridge
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm run check:gate-contract
    - npm run build
    - npm audit --audit-level=high

fenrir-cinema:install-and-build:
  stage: verify
  image: node:22
  rules:
    - exists:
        - apps/fenrir-cinema/package.json
  script:
    - cd apps/fenrir-cinema
    - npm ci
    - npm run lint
    - npm run build
    - npm audit --audit-level=high

# Production deploy for fenrir-bridge to Cloudflare Pages.
#
# Auth in CI is API-token based (CLOUDFLARE_API_TOKEN), NOT the operator's
# browser OAuth. The repo's `npm run deploy:ci` runs a guard that does
# `wrangler whoami` with the token stripped, which only works with OAuth and
# would fail here, so this job calls wrangler directly with the token.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables, all "Masked",
# "Protected" so they only expose on the protected main branch):
#   CLOUDFLARE_API_TOKEN   - Cloudflare token scoped to Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
#   SESSION_SECRET         - Pages session signing secret
#
# Gated to main and manual: click "Run" on the pipeline to ship. To make merges
# auto-deploy, change `when: manual` to `when: on_success`.
fenrir-bridge:deploy:
  stage: deploy
  image: node:22
  needs:
    - fenrir-bridge:install-and-build
    - fenrir-bridge:test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
      when: manual
  variables:
    WRANGLER: "npx wrangler"
    WRANGLER_SEND_METRICS: "false"
  script:
    - cd apps/fenrir-bridge
    - npm ci
    - npm run build
    # Push production secrets only when provided, so an unset var never clobbers
    # an existing value with an empty string.
    - |
      for k in SESSION_SECRET; do
        v="$(eval printf '%s' "\${$k:-}")"
        if [ -n "$v" ]; then
          printf '%s' "$v" | $WRANGLER pages secret put "$k" --project-name fenrir-bridge
          echo "set $k"
        else
          echo "skip $k (not set in CI variables)"
        fi
      done
    - $WRANGLER pages deploy dist --project-name fenrir-bridge --branch main
    # Verify production responds as expected.
    - |
      hz="$(curl -s -o /dev/null -w '%{http_code}' https://www.myfenrir.com/healthz || echo ERR)"
      echo "healthz=$hz (expect 200)"
      test "$hz" = "200"

# =====================================================================
# MyFenrir CI/CD — Quality (auto) + prod symmetry.  Added on ci/quality-pipeline.
# Branch model:  main -> prod (manual),  quality -> Quality (auto on push).
# Cloudflare account: e2a7eccb24c4836847fd14d08c499bd0  (NEVER f2ff2cc0).
#
# TOKEN SCOPE (read before enabling Quality):
#   CLOUDFLARE_API_TOKEN is Masked+Protected, so GitLab exposes it only to
#   pipelines running on PROTECTED branches. Mark `quality` as a Protected
#   branch (Settings -> Repository -> Protected branches; allow your role to
#   push/merge) so these jobs receive the token. Until then the rule
#   `&& $CLOUDFLARE_API_TOKEN` is false and the jobs are SKIPPED — a fail-safe
#   that prevents a half-configured deploy. Do NOT un-protect the token.
# =====================================================================

# fenrir-bridge -> Cloudflare Pages PREVIEW branch `quality`.
# Isolated from production: the production alias only moves on `--branch main`.
fenrir-bridge:deploy:quality:
  stage: deploy
  image: node:22
  needs:
    - fenrir-bridge:install-and-build
    - fenrir-bridge:test
  rules:
    - if: '$CI_COMMIT_BRANCH == "quality" && $CLOUDFLARE_API_TOKEN'
      when: on_success
  variables:
    WRANGLER: "npx wrangler"
    WRANGLER_SEND_METRICS: "false"
    CLOUDFLARE_ACCOUNT_ID: "e2a7eccb24c4836847fd14d08c499bd0"
  script:
    - cd apps/fenrir-bridge
    - npm ci
    - npm run build
    - $WRANGLER pages deploy dist --project-name fenrir-bridge --branch quality --commit-dirty=true
    - |
      # Verify the Quality preview surface responds (branch alias URL).
      url="https://quality.fenrir-bridge.pages.dev/healthz"
      hz="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo ERR)"
      echo "quality healthz=$hz ($url) (expect 200)"
      test "$hz" = "200"

# community-bridge -> Worker `community-bridge-quality` via the repo's own
# scripts/deploy-quality.sh (pins Quality VITE_SITE_URL + the DEV Telegram bot
# and the explicit --name). The script reads CLOUDFLARE_API_TOKEN from the CI
# env automatically; run locally it falls back to wrangler OAuth (same script).
community-bridge:deploy:quality:
  stage: deploy
  image: node:22
  needs:
    - community-bridge:verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "quality" && $CLOUDFLARE_API_TOKEN'
      when: on_success
  variables:
    WRANGLER_SEND_METRICS: "false"
    CLOUDFLARE_ACCOUNT_ID: "e2a7eccb24c4836847fd14d08c499bd0"
  script:
    - cd apps/community-bridge
    # Belt-and-suspenders: never let a project-wide prod bot var leak into Quality.
    - unset VITE_TELEGRAM_BOT_USERNAME || true
    - npm ci
    - bash scripts/deploy-quality.sh
    - |
      url="https://quality.communities.myfenrir.com/"
      code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo ERR)"
      echo "quality communities http=$code ($url)"
      canon="$(curl -s "$url" | grep -o 'rel=\"canonical\" href=\"[^\"]*\"' | head -1)"
      echo "canonical=$canon (must not be localhost)"
      case "$code" in 2*|3*) : ;; *) echo "unexpected status"; exit 1 ;; esac

# community-bridge -> production custom-domain Worker. CONFIGURED BUT OFF:
# manual + main only. Requires PROD_TELEGRAM_BOT_USERNAME as a Masked+Protected
# CI variable — deliberately NOT hardcoded (the prod bot handle was not
# derivable from the repo). Refuses to build prod with a dev-bot fallback.
community-bridge:deploy:
  stage: deploy
  image: node:22
  needs:
    - community-bridge:verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
      when: manual
  variables:
    WRANGLER_SEND_METRICS: "false"
    CLOUDFLARE_ACCOUNT_ID: "e2a7eccb24c4836847fd14d08c499bd0"
    VITE_SITE_URL: "https://communities.myfenrir.com"
  script:
    - cd apps/community-bridge
    - |
      if [ -z "${PROD_TELEGRAM_BOT_USERNAME:-}" ]; then
        echo "PROD_TELEGRAM_BOT_USERNAME not set — refusing to build prod with a dev-bot fallback."
        exit 1
      fi
    - npm ci
    - VITE_TELEGRAM_BOT_USERNAME="$PROD_TELEGRAM_BOT_USERNAME" bash scripts/deploy-production.sh
    - |
      url="https://communities.myfenrir.com/"
      code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo ERR)"
      echo "prod communities http=$code"; case "$code" in 2*|3*) : ;; *) exit 1 ;; esac

# =====================================================================
# Example: Depot-powered Docker build (disabled by default)
#
# Depot runs the actual container build on fast remote builders with
# persistent layer cache. The GitLab job only runs the thin CLI wrapper,
# which helps conserve shared runner minutes for real Docker builds.
#
# Current pipeline has no docker builds (only node:22 + wrangler), so this
# job is intentionally gated off until you need it.
#
# Setup (one-time):
# 1. Note your Depot project ID (currently: k24w8s6znm / "default")
# 2. In the Depot dashboard for project k24w8s6znm:
#    Settings → Trust Relationships → "Add trust relationship"
#    - Provider: GitLab CI
#    - GitLab namespace ID: 139139955
#    - GitLab project ID: 82627266
#    - (Recommended) Restrict to protected refs: yes
# 3. (Optional but recommended) Add a masked CI/CD variable:
#      DEPOT_PROJECT_ID = k24w8s6znm
#
# Usage:
#   - Trigger a pipeline with variable USE_DEPOT_DOCKER=1
#   - The job requests DEPOT_OIDC_TOKEN (aud: https://depot.dev)
#   - No static Depot token is stored in GitLab
#
# The OIDC trust allows the Depot CLI running in GitLab CI to
# authenticate without secrets.
# =====================================================================

fenrir-bridge:docker-build:depot:
  stage: verify
  id_tokens:
    DEPOT_OIDC_TOKEN:
      aud: https://depot.dev
  rules:
    - if: '$USE_DEPOT_DOCKER == "1"'
      when: on_success
    - when: never
  before_script:
    - curl -fsSL https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
  script:
    - |
      depot build \
        --project "${DEPOT_PROJECT_ID:-k24w8s6znm}" \
        -f apps/fenrir-bridge/Dockerfile \
        -t fenrir-bridge:${CI_COMMIT_SHA:-latest} \
        apps/fenrir-bridge
  allow_failure: true
  variables:
    # Optional: uncomment if you want to force a specific builder size
    # DEPOT_BUILDER: "x86-64-16x32"  # or arm-64-16x32 etc.
