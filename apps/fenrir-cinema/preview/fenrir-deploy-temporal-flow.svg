<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" fill="none" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#030607"/><rect width="1920" height="1080" fill="url(#bg)"/><path stroke="#B8FF46" stroke-opacity=".24" d="M64 128H1856"/><text x="64" y="86" fill="#B8FF46" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">FENRIR BRIDGE RELEASE GATE</text><text x="64" y="126" fill="#F8FFF4" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">Go / No-Go Solution</text><rect width="500" height="680" x="70" y="202" fill="rgba(16,18,32,.92)" stroke="#7C5CFF" stroke-opacity=".72" rx="28"/><text x="104" y="260" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">TEMPORAL WORKFLOW</text><text x="104" y="320" fill="#F8FFF4" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">FenrirGoNoGoWorkflow</text><text x="104" y="370" fill="#A8B7B4" font-family="Inter, Arial, sans-serif" font-size="23">Durable history records the candidate,</text><text x="104" y="402" fill="#A8B7B4" font-family="Inter, Arial, sans-serif" font-size="23">evidence, verdict, and rollback state.</text><g fill="#F8FFF4" font-family="Inter, Arial, sans-serif" font-size="22"><rect width="402" height="58" x="104" y="464" fill="rgba(255,255,255,.05)" stroke="rgba(190,211,220,.24)" rx="14"/><text x="124" y="501">Task queue: fenrir-release-gate</text><rect width="402" height="58" x="104" y="540" fill="rgba(255,255,255,.05)" stroke="rgba(190,211,220,.24)" rx="14"/><text x="124" y="577">GO requires every critical check</text><rect width="402" height="58" x="104" y="616" fill="rgba(255,255,255,.05)" stroke="rgba(190,211,220,.24)" rx="14"/><text x="124" y="653">NO-GO freezes traffic changes</text><rect width="402" height="58" x="104" y="692" fill="rgba(255,255,255,.05)" stroke="rgba(190,211,220,.24)" rx="14"/><text x="124" y="729">Signals: cancel, approve, rollback</text></g><path stroke="url(#flow)" stroke-linecap="round" stroke-width="5" d="M606 486H1636"/><path stroke="url(#flow2)" stroke-linecap="round" stroke-width="5" d="M606 772H1376" opacity=".72"/><g font-family="Inter, Arial, sans-serif"><g transform="translate(650 228)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#7C5CFF" rx="22"/><text x="24" y="38" fill="#7C5CFF" font-size="18" font-weight="800">TRIGGER</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">Release candidate</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Operator proposes a Cloud Run</text><text x="24" y="152" fill="#A8B7B4" font-size="20">revision for launch review.</text></g><g transform="translate(1036 228)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#B8FF46" rx="22"/><text x="24" y="38" fill="#B8FF46" font-size="18" font-weight="800">ACTIVITY</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">Preflight checks</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Typecheck, build, env shape,</text><text x="24" y="152" fill="#A8B7B4" font-size="20">and VITE inputs must pass.</text></g><g transform="translate(1422 228)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#4BB3FF" rx="22"/><text x="24" y="38" fill="#4BB3FF" font-size="18" font-weight="800">ACTIVITY</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">Staging revision</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Cloud Build creates image and</text><text x="24" y="152" fill="#A8B7B4" font-size="20">Cloud Run exposes candidate.</text></g><g transform="translate(650 514)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#4BB3FF" rx="22"/><text x="24" y="38" fill="#4BB3FF" font-size="18" font-weight="800">ACTIVITY</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">Probe solution</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Verify shell, auth routing,</text><text x="24" y="152" fill="#A8B7B4" font-size="20">Supabase base, route safety.</text></g><g transform="translate(1036 514)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#37F6FF" rx="22"/><text x="24" y="38" fill="#37F6FF" font-size="18" font-weight="800">ACTIVITY</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">Go criteria</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Launch passes only when every</text><text x="24" y="152" fill="#A8B7B4" font-size="20">required signal is green.</text></g><g transform="translate(1422 514)"><rect width="330" height="214" fill="rgba(8,15,18,.9)" stroke="#FFD166" rx="22"/><text x="24" y="38" fill="#FFD166" font-size="18" font-weight="800">DECISION</text><text x="24" y="84" fill="#F8FFF4" font-size="31" font-weight="900">GO / NO-GO or rollback</text><text x="24" y="124" fill="#A8B7B4" font-size="20">Green deploy stays live.</text><text x="24" y="152" fill="#A8B7B4" font-size="20">Failed verify escalates.</text></g></g><rect width="760" height="84" x="64" y="902" fill="rgba(8,15,18,.82)" stroke="#B8FF46" stroke-opacity=".5" rx="22"/><text x="92" y="936" fill="#B8FF46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">COMMAND</text><text x="92" y="970" fill="#F8FFF4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">npm run deploy:gcloud</text><rect width="674" height="84" x="1182" y="902" fill="rgba(255,77,109,.14)" stroke="#FF4D6D" stroke-opacity=".7" rx="22"/><text x="1210" y="936" fill="#FF4D6D" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">NO-GO PATH</text><text x="1210" y="970" fill="#F8FFF4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">rollback signal, previous revision, operator notice</text><defs><linearGradient id="bg" x1="0" x2="1920" y1="0" y2="1080" gradientUnits="userSpaceOnUse"><stop stop-color="#071114"/><stop offset=".45" stop-color="#05090A"/><stop offset="1" stop-color="#101308"/></linearGradient><linearGradient id="flow" x1="606" x2="1636" y1="486" y2="486" gradientUnits="userSpaceOnUse"><stop stop-color="#7C5CFF"/><stop offset=".28" stop-color="#B8FF46"/><stop offset=".62" stop-color="#4BB3FF"/><stop offset="1" stop-color="#37F6FF"/></linearGradient><linearGradient id="flow2" x1="606" x2="1376" y1="772" y2="772" gradientUnits="userSpaceOnUse"><stop stop-color="#4BB3FF"/><stop offset=".7" stop-color="#37F6FF"/><stop offset="1" stop-color="#FFD166"/></linearGradient></defs></svg>