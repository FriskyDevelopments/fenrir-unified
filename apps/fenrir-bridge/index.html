<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff1744" />
    <link rel="icon" type="image/svg+xml" href="/fenrir-splash-icon.svg" />
    <link rel="apple-touch-icon" href="/fenrir-splash-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Fenrir Bridge by Frisky</title>
    <style>
      .cursor-referral-banner {
        position: relative;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 10px 16px;
        color: #f8fffb;
        background:
          linear-gradient(90deg, rgba(255, 23, 68, .18), transparent 24%, rgba(34, 199, 168, .16) 76%, rgba(241, 183, 92, .22)),
          linear-gradient(135deg, #14070a 0%, #10191a 48%, #20160a 100%);
        border-bottom: 1px solid rgba(241, 183, 92, .34);
        box-shadow: 0 14px 42px rgba(0, 0, 0, .26);
      }

      .cursor-referral-banner a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: min(100%, 980px);
        color: inherit;
        text-decoration: none;
        font: 750 13px/1.3 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      .cursor-referral-banner strong {
        color: #ffffff;
        text-transform: uppercase;
      }

      .cursor-referral-banner .cursor-badge {
        flex: 0 0 auto;
        border: 1px solid rgba(34, 199, 168, .48);
        border-radius: 999px;
        padding: 4px 8px;
        color: #9ff4e4;
        background: rgba(34, 199, 168, .1);
        font-size: 11px;
      }

      .cursor-referral-banner .cursor-action {
        flex: 0 0 auto;
        color: #07100d;
        border-radius: 999px;
        padding: 5px 10px;
        background: linear-gradient(135deg, #9ff4e4, #f1b75c);
        box-shadow: 0 0 24px rgba(34, 199, 168, .22);
      }

      @media (max-width: 640px) {
        .cursor-referral-banner {
          padding: 9px 12px;
        }

        .cursor-referral-banner a {
          flex-wrap: wrap;
          gap: 6px 8px;
          font-size: 12px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="cursor-referral-banner" role="region" aria-label="Cursor referral promotion">
      <a href="https://cursor.com/referral?code=NCRSSVQILBHU" target="_blank" rel="noopener noreferrer">
        <span class="cursor-badge">Frisky Dev perk</span>
        <span><strong>50% off Cursor</strong> for builders shipping through MyFenrir.</span>
        <span class="cursor-action">Claim code</span>
      </a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
