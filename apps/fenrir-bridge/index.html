<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff1744" />
    <link rel="icon" type="image/svg+xml" href="/fenrir-splash-icon.svg" />
    <link rel="apple-touch-icon" href="/fenrir-splash-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Fenrir Bridge by Frisky</title>
    <style>
      .partner-perk-banner {
        position: relative;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 10px 16px;
        color: #e9ebe7;
        background: #171d23;
        border-bottom: 1px solid #2b333b;
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.22);
      }

      .partner-perk-banner a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: min(100%, 980px);
        color: inherit;
        text-decoration: none;
        font:
          750 13px/1.3 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      .partner-perk-banner strong {
        color: #ffffff;
        text-transform: uppercase;
      }

      .partner-perk-banner .perk-badge {
        flex: 0 0 auto;
        border: 1px solid rgba(194, 164, 105, 0.45);
        border-radius: 999px;
        padding: 4px 8px;
        color: #c2a469;
        background: rgba(194, 164, 105, 0.1);
        font-size: 11px;
      }

      .partner-perk-banner .perk-action {
        flex: 0 0 auto;
        color: #141a20;
        border-radius: 999px;
        padding: 5px 10px;
        background: #c2a469;
        box-shadow: none;
      }

      @media (max-width: 640px) {
        .partner-perk-banner {
          padding: 9px 12px;
        }

        .partner-perk-banner a {
          flex-wrap: wrap;
          gap: 6px 8px;
          font-size: 12px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div
      class="partner-perk-banner"
      role="region"
      aria-label="Lovable invite promotion"
    >
      <a
        href="https://lovable.dev/invite/U9MXM38"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="perk-badge">Frisky Dev perk</span>
        <span
          ><strong>Lovable</strong> for builders shipping through
          MyFenrir.</span
        >
        <span class="perk-action">Get invite</span>
      </a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
