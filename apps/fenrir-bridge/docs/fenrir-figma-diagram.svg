<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1420 130) rotate(139) scale(1080 720)">
      <stop stop-color="#14F1D9" stop-opacity="0.28"/>
      <stop offset="0.38" stop-color="#E8A735" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tornasol" x1="270" y1="100" x2="1650" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16F1D4"/>
      <stop offset="0.34" stop-color="#6CE7FF"/>
      <stop offset="0.64" stop-color="#E8A735"/>
      <stop offset="1" stop-color="#FF4D5D"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151B22"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#14F1D9" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill: #05070A; }
      .muted { fill: #8B99A9; font: 500 26px Inter, Arial, sans-serif; }
      .tiny { fill: #8B99A9; font: 600 21px Inter, Arial, sans-serif; letter-spacing: .6px; }
      .title { fill: #F5F7FA; font: 800 70px Inter, Arial, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #B8C4D2; font: 500 30px Inter, Arial, sans-serif; }
      .cardTitle { fill: #F7FAFC; font: 800 34px Inter, Arial, sans-serif; }
      .cardBody { fill: #ACB8C7; font: 500 23px Inter, Arial, sans-serif; }
      .label { fill: #14F1D9; font: 800 20px Inter, Arial, sans-serif; letter-spacing: 2.4px; }
      .pillText { fill: #071014; font: 800 22px Inter, Arial, sans-serif; }
      .darkPillText { fill: #EAF7F6; font: 800 21px Inter, Arial, sans-serif; }
      .mono { fill: #D7FFF8; font: 700 24px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .node { fill: url(#panel); stroke: #253140; stroke-width: 1.4; filter: url(#softShadow); }
      .nodeHot { fill: #0B1419; stroke: url(#tornasol); stroke-width: 2.4; filter: url(#softShadow); }
      .line { stroke: url(#tornasol); stroke-width: 5; stroke-linecap: round; }
      .lineGhost { stroke: #263443; stroke-width: 3; stroke-dasharray: 10 12; stroke-linecap: round; }
      .ok { fill: #49F2A9; }
      .warn { fill: #E8A735; }
      .danger { fill: #FF4D5D; }
    </style>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L16 9L2 16V2Z" fill="#18E8D0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L16 9L2 16V2Z" fill="#E8A735"/>
    </marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  <path d="M120 130C460 34 700 120 960 218C1225 318 1488 420 1800 276" class="lineGhost"/>
  <path d="M110 930C370 775 612 840 892 900C1184 963 1420 948 1795 760" class="lineGhost"/>

  <text x="120" y="112" class="label">FENRIR.LINK OPERATING DIAGRAM</text>
  <text x="120" y="184" class="title">Stable links. Rotatable invites.</text>
  <text x="120" y="232" class="subtitle">A Coolify-hosted domain bridge for Telegram locks, live rooms, DNS checks, and revocations.</text>

  <g transform="translate(1510 86)">
    <rect width="250" height="72" rx="26" fill="#0B1419" stroke="url(#tornasol)" stroke-width="2"/>
    <text x="28" y="46" class="darkPillText">🐺 Fenrir by Frisky</text>
  </g>

  <g transform="translate(120 320)">
    <rect class="nodeHot" width="330" height="180" rx="28"/>
    <text x="28" y="48" class="label">PUBLIC ENTRY</text>
    <text x="28" y="92" class="cardTitle">fenrir.link</text>
    <text x="28" y="130" class="cardBody">Generic subdomain</text>
    <text x="28" y="162" class="mono">/join/main</text>
  </g>

  <g transform="translate(590 300)">
    <rect class="node" width="360" height="220" rx="28"/>
    <text x="28" y="50" class="label">COOLIFY</text>
    <text x="28" y="96" class="cardTitle">Docker app</text>
    <text x="28" y="136" class="cardBody">Nginx serves the SPA</text>
    <text x="28" y="168" class="cardBody">Healthcheck: /healthz</text>
    <rect x="28" y="182" width="152" height="32" rx="16" fill="#102A2B" stroke="#18E8D0"/>
    <text x="46" y="205" class="tiny" fill="#18E8D0">PORT 80</text>
  </g>

  <g transform="translate(1080 300)">
    <rect class="node" width="360" height="220" rx="28"/>
    <text x="28" y="50" class="label">DATA LAYER</text>
    <text x="28" y="96" class="cardTitle">Frisky IDs</text>
    <text x="28" y="136" class="cardBody">bridges, invites, domains</text>
    <text x="28" y="168" class="cardBody">audit log + plan gates</text>
    <text x="28" y="205" class="mono">frisky_brg_MAIN7</text>
  </g>

  <g transform="translate(1510 300)">
    <rect class="nodeHot" width="290" height="220" rx="28"/>
    <text x="28" y="50" class="label">TARGET</text>
    <text x="28" y="96" class="cardTitle">Telegram</text>
    <text x="28" y="136" class="cardBody">Current invite is private</text>
    <text x="28" y="168" class="cardBody">Rotate without changing URL</text>
    <rect x="28" y="182" width="190" height="32" rx="16" fill="#2B1115" stroke="#FF4D5D"/>
    <text x="46" y="205" class="tiny">RAW LINK HIDDEN</text>
  </g>

  <path d="M466 410H568" class="line" marker-end="url(#arrow)"/>
  <path d="M970 410H1058" class="line" marker-end="url(#arrow)"/>
  <path d="M1460 410H1488" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(270 620)">
    <rect class="node" width="300" height="180" rx="24"/>
    <circle cx="48" cy="52" r="13" class="ok" filter="url(#glow)"/>
    <text x="78" y="60" class="cardTitle">DNS Wizard</text>
    <text x="28" y="102" class="cardBody">TXT verification</text>
    <text x="28" y="134" class="cardBody">CNAME to bridge</text>
    <text x="28" y="164" class="tiny">Cloudflare recommended</text>
  </g>

  <g transform="translate(650 620)">
    <rect class="node" width="300" height="180" rx="24"/>
    <circle cx="48" cy="52" r="13" class="warn"/>
    <text x="78" y="60" class="cardTitle">Admin Ops</text>
    <text x="28" y="102" class="cardBody">Cursor builds</text>
    <text x="28" y="134" class="cardBody">Jules reviews</text>
    <text x="28" y="164" class="tiny">Anti-Gravity tracks</text>
  </g>

  <g transform="translate(1030 620)">
    <rect class="node" width="300" height="180" rx="24"/>
    <circle cx="48" cy="52" r="13" class="danger"/>
    <text x="78" y="60" class="cardTitle">Revocation</text>
    <text x="28" y="102" class="cardBody">Kill old invite</text>
    <text x="28" y="134" class="cardBody">Create fresh invite</text>
    <text x="28" y="164" class="tiny">Public URL stays forever</text>
  </g>

  <g transform="translate(1410 620)">
    <rect class="node" width="300" height="180" rx="24"/>
    <circle cx="48" cy="52" r="13" class="ok"/>
    <text x="78" y="60" class="cardTitle">Live Rooms</text>
    <text x="28" y="102" class="cardBody">Zoom, Webex, Meet</text>
    <text x="28" y="134" class="cardBody">Paid plan feature</text>
    <text x="28" y="164" class="tiny">Starter and above</text>
  </g>

  <path d="M420 606C520 560 642 540 730 528" class="lineGhost"/>
  <path d="M805 606C890 552 1002 532 1118 526" class="lineGhost"/>
  <path d="M1190 606C1268 548 1392 524 1535 520" class="lineGhost"/>

  <g transform="translate(120 884)">
    <rect width="1680" height="92" rx="30" fill="#081014" stroke="#1A2632"/>
    <text x="34" y="38" class="tiny">SHARE THIS</text>
    <text x="34" y="70" class="mono">https://fenrir.link/join/main</text>
    <rect x="1260" y="22" width="366" height="48" rx="24" fill="url(#tornasol)"/>
    <text x="1292" y="55" class="pillText">Public link never changes</text>
  </g>
</svg>
