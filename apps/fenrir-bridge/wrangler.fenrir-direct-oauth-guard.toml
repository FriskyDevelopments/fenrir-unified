name = "fenrir-direct-oauth-guard"
main = "workers/fenrir-direct-oauth-guard.js"
compatibility_date = "2026-08-28"

# Only intercept retired auth.myfenrir.com login/callback paths.
# Apex / www stay on Pages. Fenrir Better Auth owns myfenrir.com/auth/*.
routes = [
  { pattern = "auth.myfenrir.com/api/auth/login/*", zone_name = "myfenrir.com" },
  { pattern = "auth.myfenrir.com/api/auth/callback/*", zone_name = "myfenrir.com" }
]
