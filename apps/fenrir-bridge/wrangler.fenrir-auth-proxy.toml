name = "fenrir-auth-proxy"
main = "workers/fenrir-auth-proxy-retired.js"
compatibility_date = "2026-08-28"

# RETIRED. Authentic/Supabase proxy on auth.myfenrir.com is stopped.
# Fenrir Better Auth lives on myfenrir.com/auth/* (wrangler.fenrir-auth.jsonc).
# Keep this Worker on auth.myfenrir.com so leftover OAuth apps get a 410, not a
# silent Supabase proxy.

[vars]
AUTH_PROXY_RETIRED_HINT = "https://myfenrir.com/login"

route = { pattern = "auth.myfenrir.com/*", zone_name = "myfenrir.com" }
