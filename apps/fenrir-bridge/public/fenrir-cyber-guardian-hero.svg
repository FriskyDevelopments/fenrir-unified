<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fenrir cybersecurity guardian hero</title>
  <desc id="desc">A mythic Fenrir wolf guards a glowing encrypted access gate with shield, lock, and network security signals.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="44%" r="74%">
      <stop offset="0" stop-color="#18282c"/>
      <stop offset=".34" stop-color="#081315"/>
      <stop offset="1" stop-color="#020506"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="51%" r="42%">
      <stop offset="0" stop-color="#ff334e" stop-opacity=".52"/>
      <stop offset=".36" stop-color="#f1b75c" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#22c7a8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="338" x2="1262" y1="224" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff334e"/>
      <stop offset=".45" stop-color="#f1b75c"/>
      <stop offset="1" stop-color="#22c7a8"/>
    </linearGradient>
    <linearGradient id="fur" x1="360" x2="1220" y1="180" y2="860" gradientUnits="userSpaceOnUse">
