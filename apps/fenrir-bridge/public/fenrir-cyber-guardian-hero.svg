      <stop stop-color="#ff6b7a"/>
      <stop offset=".45" stop-color="#f1b75c"/>
      <stop offset="1" stop-color="#22c7a8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="34" stdDeviation="26" flood-color="#000" flood-opacity=".58"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#22c7a8" flood-opacity=".13"/>
    </filter>
  </defs>

