name = "fenrir-stars-payments"
main = "workers/fenrir-stars-payments.js"
compatibility_date = "2026-05-08"

[vars]
GEMINI_MODEL = "gemini-3-flash-preview"
# Codified here (not dashboard-only) so a `wrangler deploy` can never drop them again.
# Prior "changes kept reverting" was a split-brain between dashboard/script-API vars and
# local toml deploys clobbering each other.
FENRIR_TELEGRAM_BOT_USERNAME = "Myfenrir_bot"
FENRIR_STARS_PRICE = "1150"
FENRIR_STARS_PLAN = "standard"
FENRIR_STARS_TITLE = "The Pack · MyFenrir"
FENRIR_STARS_DESCRIPTION = "The Pack — $14.99/month. Multi-admin and audit logs. Billed monthly in Telegram Stars."
FENRIR_STARS_LABEL = "The Pack"
FENRIR_LINK_CONFIRM_URL = "https://www.myfenrir.com/api/telegram/link/confirm"

[[d1_databases]]
binding = "DB"
database_name = "fenrir-bridge"
database_id = "1238059e-2638-4317-982e-e74dda046ccb"
